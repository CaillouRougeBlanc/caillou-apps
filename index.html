function space(b){let c=document.createElement('canvas');c.className='gamecanvas';c.width=700;c.height=480;b.innerHTML=panel('🚀 Space Invaders',`<div class="small">Touchez la zone pour déplacer. Appuyez sur 🔥 pour tirer.</div>`);b.querySelector('.panel').append(c);let x=c.getContext('2d'),px=350,bul=[],ali=[],score=0;for(let r=0;r<3;r++)for(let j=0;j<8;j++)ali.push({x:80+j*75,y:50+r*45,alive:1});c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();px=(e.clientX-r.left)*700/r.width});let fire=document.createElement('button');fire.textContent='🔥 Tirer';b.querySelector('.panel').append(fire);fire.onclick=()=>bul.push({x:px,y:430});function loop(){x.fillStyle='#05070d';x.fillRect(0,0,700,480);x.fillStyle='#6ea8ff';x.fillRect(px-20,440,40,18);x.fillStyle='#f59e0b';for(let q of bul){q.y-=7;x.fillRect(q.x-2,q.y,4,10)}for(let q of ali)if(q.alive){x.fillStyle='#7dd3fc';x.fillRect(q.x-18,q.y-10,36,20)}for(let q of bul)for(let a of ali)if(a.alive&&Math.abs(q.x-a.x)<20&&Math.abs(q.y-a.y)<16){a.alive=0;q.y=-99;score++}x.fillStyle='#fff';x.fillText('Score '+score,15,25);requestAnimationFrame(loop)}loop()}

function race(b){let c=document.createElement('canvas');c.className='gamecanvas';c.width=700;c.height=500;b.innerHTML=panel('🏎️ Course de voitures',`<div class="small">Glisse ton doigt horizontalement pour piloter.</div>`);b.querySelector('.panel').append(c);let x=c.getContext('2d'),car=350,obs=[],score=0;function spawn(){obs.push({x:80+Math.random()*540,y:-40})}setInterval(spawn,900);c.onpointermove=e=>{let r=c.getBoundingClientRect();car=Math.max(150,Math.min(550,(e.clientX-r.left)*700/r.width))};function loop(){x.fillStyle='#263238';x.fillRect(0,0,700,500);x.fillStyle='#eee';x.fillRect(130,0,8,500);x.fillRect(562,0,8,500);x.fillStyle='#e84a5f';x.fillRect(car-22,420,44,60);x.fillStyle='#f5c400';for(let o of obs){o.y+=5;x.fillRect(o.x-18,o.y,36,45);if(o.y>400&&Math.abs(o.x-car)<38)score=0}score++;x.fillStyle='#fff';x.fillText('Distance '+Math.floor(score/10),15,25);requestAnimationFrame(loop)}loop()}
function pong(b){let c=document.createElement('canvas');c.className='gamecanvas';c.width=700;c.height=420;b.innerHTML=panel('🏓 Caillou Pong',`<div class="small">Déplace ta raquette avec le doigt.</div>`);b.querySelector('.panel').append(c);let x=c.getContext('2d'),py=180,by=200,bx=350,vx=4,vy=3; c.onpointermove=e=>{let r=c.getBoundingClientRect();py=(e.clientY-r.top)*420/r.height-45};function loop(){x.fillStyle='#07101c';x.fillRect(0,0,700,420);py=Math.max(0,Math.min(330,py));x.fillStyle='#6ea8ff';x.fillRect(20,py,14,90);x.fillStyle='#fff';x.fillRect(665,by,14,90);x.beginPath();x.arc(bx,by+7,8,0,7);x.fill();bx+=vx;by+=vy;if(by<0||by>413)vy*=-1;if(bx<42&&by>py-8&&by<py+98)vx=Math.abs(vx);if(bx>655&&by>by-1)vx=-Math.abs(vx);if(bx<0||bx>700){bx=350;by=200}requestAnimationFrame(loop)}loop()}
function dino(b){let c=document.createElement('canvas');c.className='gamecanvas';c.width=700;c.height=300;b.innerHTML=panel('🦖 Caillou Dino Run',`<div class="small">Touchez pour sauter.</div>`);b.querySelector('.panel').append(c);let x=c.getContext('2d'),dy=220,vy=0,obs=[],score=0;c.onpointerdown=()=>{if(dy>=220)vy=-13};setInterval(()=>obs.push({x:700,y:230}),1200);function loop(){x.fillStyle='#cdeeff';x.fillRect(0,0,700,300);x.fillStyle='#355';x.fillRect(0,260,700,3);dy+=.6;dy=Math.min(220,dy+vy);if(dy<220)vy+=.6;for(let o of obs){o.x-=6;x.fillStyle='#26734d';x.fillRect(o.x,230,22,30);if(o.x<70&&o.x>25&&dy>190)score=0}score++;x.fillStyle='#222';x.fillRect(45,dy,35,40);x.fillText('Score '+Math.floor(score/10),15,25);requestAnimationFrame(loop)}loop()}

function slots(b){let icons=['🍋','🍒','⭐','🔔','💎','7️⃣'],coins=100,spins=0;b.innerHTML=panel('🎰 Machine à sous fictive',`<div class="small">Jeu fictif : aucune mise, aucun argent réel.</div><div id="slot" class="timer">🍒 ⭐ 🍋</div><div class="center"><span class="pill">Jetons fictifs : <b id="coins">100</b></span></div><button style="width:100%;margin-top:12px" onclick="spinSlot()">🎰 Lancer</button><div id="slotout" class="out"></div>`);window.spinSlot=()=>{spins++;let a=[0,0,0].map(()=>icons[Math.floor(Math.random()*icons.length)]);slot.textContent=a.join(' ');let gain=a[0]===a[1]&&a[1]===a[2]?25:a[0]===a[1]||a[1]===a[2]||a[0]===a[2]?5:0;coins+=gain;coins.textContent=coins;slotout.textContent=gain?`Combinaison gagnante fictive : +${gain} jetons !`:'Nouvelle combinaison.';if(spins%10===0)slotout.textContent+='\nAucun argent réel n’est utilisé.'};}

function assistant(b){
 let history=load('assistant_history',[]);
 const suggestions=['Que peux-tu faire ?','Quelle heure est-il ?','Ouvre Memory','Donne-moi une idée','Mes applications récentes'];
 b.innerHTML=panel('🤖 Caillou Assistant',`
   <div class="assistantHead"><div><div class="assistantTitle">Caillou Assistant</div><div class="small">Assistant local • commandes rapides • sans compte</div></div><div class="assistantOrb">🪨</div></div>
   <div id="asuggest" class="assistantSuggestions">${suggestions.map(x=>`<button class="secondary" onclick="assistantQuick(${JSON.stringify(x)})">${esc(x)}</button>`).join('')}</div>
   <div id="achat" class="assistantChat" aria-live="polite"></div>
   <div class="assistantSearch"><input id="aq" class="field" placeholder="Écris à Caillou…" autocomplete="off"><button onclick="askAssistant()">Envoyer</button><button class="secondary" id="avoice" onclick="assistantVoice()">🎙️</button></div>
   <div class="row"><button class="secondary" onclick="assistantClear()">🗑️ Effacer la conversation</button><button class="secondary" onclick="assistantSpeakLast()">🔊 Lire la dernière réponse</button></div>
   <div class="small" style="margin-top:10px">Astuce : « ouvre le Sudoku », « lance un jeu », « montre mes favoris », « réglages », « profil » ou « aide ».</div>`);
 function draw(){achat.innerHTML=history.slice(-30).map(m=>`<div class="assistantMsg ${m.who==='toi'?'me':'bot'}"><span>${m.who==='toi'?'Toi':'Caillou'}</span><div>${esc(m.text)}</div>${m.app?`<button class="assistantOpen" onclick="openByTitle(${JSON.stringify(m.app)})">🚀 Ouvrir ${esc(m.app)}</button>`:''}</div>`).join('');achat.scrollTop=achat.scrollHeight}
 function add(who,text,app=''){history.push({who,text,app});history=history.slice(-60);save('assistant_history',history);draw()}
 function norm(q){return q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
 function findApp(q){let n=norm(q);let clean=n.replace(/^(ouvre|ouvrir|lance|lancer|demarre|demarrer|joue|jouer|essaie|essaye|appelle|montre)\s+(l'|la |le |les |un |une )?/,'').trim();let exact=apps.find(a=>norm(a[1])===clean);if(exact)return exact;return apps.find(a=>norm(a[1]).includes(clean)||clean.includes(norm(a[1])))||apps.find(a=>norm(a[2]).includes(clean));}
 function randomApp(){let a=apps[Math.floor(Math.random()*apps.length)];return a}
 function answer(q){let n=norm(q);if(!n)return;
   if(/^(bonjour|salut|hello|coucou|bonsoir)/.test(n))return ['Bonjour ! 👋 Je suis Caillou Assistant.','Je peux chercher une application, ouvrir des écrans, donner l’heure ou la date, expliquer les réglages et proposer une idée.'][Math.floor(Math.random()*2)];
   if(n.includes('heure'))return 'Il est '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'.';
   if(n.includes('date')||n.includes('quel jour'))return 'Nous sommes le '+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
   if(n.includes('combien')&&n.includes('application')||n.includes('liste des applications'))return 'Caillou Apps contient actuellement '+apps.length+' applications.';
   if(n.includes('reglage')||n.includes('parametre')||n==='settings') {showSettings();return 'J’ouvre les réglages. ⚙️'}
   if(n.includes('profil')||n.includes('niveau')||n.includes('xp')) {showProfile();return `Ton profil est au niveau ${settings.profile_level||1} avec ${settings.profile_xp||0} XP.`}
   if(n.includes('accueil')||n==='home') {home();return 'Retour à l’accueil. 🏠'}
   if(n.includes('favori')) {let f=apps.filter(a=>favoriteSet.has(a[3])).map(a=>a[1]);return f.length?'Tes favoris sont : '+f.join(', ')+'.':'Tu n’as encore aucun favori.'}
   if(n.includes('recent')||n.includes('dernier')||n.includes('recemment')) {let r=settings.recent_apps||[];return r.length?'Tes applications récentes : '+r.join(', ')+'.':'Tu n’as encore aucune application récente.'}
   if(n.includes('idee')||n.includes('que faire')||n.includes('suggere')){let a=randomApp();return {text:'Je te propose « '+a[1]+' » : '+a[2]+'.',app:a[1]}}
   if(n.includes('jeu')||n.includes('jouer')){let games=apps.filter(a=>categoryOf(a[1])==='Jeux');let a=games[Math.floor(Math.random()*games.length)];return {text:'Pourquoi pas « '+a[1]+' » ? '+a[2]+'.',app:a[1]}}
   if(n==='aide'||n.includes('que peux-tu faire')||n.includes('commandes'))return 'Je peux : ouvrir une application, te montrer tes favoris ou tes applis récentes, afficher les réglages ou ton profil, donner la date et l’heure, proposer un jeu ou une idée, et revenir à l’accueil. Exemple : « ouvre le Sudoku ». '; 
   if(n.includes('merci'))return 'Avec plaisir ! 😎';
   let a=findApp(q);if(a)return {text:'Je lance « '+a[1]+' ». 🚀',app:a[1]};
   let maybe=apps.filter(a=>norm(a[1]).split(' ').some(w=>w.length>3&&n.includes(w))).slice(0,5);if(maybe.length)return 'Je pense à : '+maybe.map(a=>a[1]).join(', ')+'. Dis « ouvre » suivi du nom pour en lancer une.';
   return 'Je n’ai pas encore compris. Essaie « aide », « ouvre Memory », « mes favoris », « réglages », « profil », « heure » ou « donne-moi une idée ».';
 }
 window.askAssistant=()=>{let q=aq.value.trim();if(!q)return;add('toi',q);aq.value='';let r=answer(q);let text=typeof r==='string'?r:r.text;add('caillou',text,typeof r==='object'?r.app:'');if(typeof r==='object'&&r.app)setTimeout(()=>openByTitle(r.app),420)};
 window.assistantQuick=q=>{aq.value=q;askAssistant()};
 window.assistantClear=()=>{history=[];save('assistant_history',history);draw();add('caillou','Conversation effacée. Bonjour ! Comment puis-je t’aider ?')};
 window.assistantSpeakLast=()=>{let m=[...history].reverse().find(x=>x.who==='caillou');if(m&&'speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(m.text);u.lang='fr-FR';speechSynthesis.speak(u)}};
 window.assistantVoice=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('🎙️ Dictée non disponible sur ce navigateur');return}let r=new SR();r.lang='fr-FR';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{aq.value=e.results[0][0].transcript;askAssistant()};r.onerror=()=>toast('🎙️ Impossible de démarrer la dictée');r.start()};
 aq.addEventListener('keydown',e=>{if(e.key==='Enter')askAssistant()});draw();if(!history.length)add('caillou','Bonjour ! 👋 Je suis Caillou Assistant. Que veux-tu faire ?')
}

function teams(b){b.innerHTML=panel('👥 Créateur d’équipe aléatoire',`<textarea id="people" class="field" rows="8" placeholder="Une personne par ligne"></textarea><input id="teamN" class="field" type="number" min="1" value="2"><button onclick="makeTeams()">Créer les équipes</button><div id="teamOut" class="out"></div>`);window.makeTeams=()=>{let p=people.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean).sort(()=>Math.random()-.5),n=Math.max(1,+teamN.value||2),a=Array.from({length:n},()=>[]);p.forEach((x,i)=>a[i%n].push(x));teamOut.textContent=a.map((x,i)=>`Équipe ${i+1}\n${x.join('\n')}`).join('\n\n')}}
function wall(b){b.innerHTML=panel('🌈 Créateur de fonds d’écran',`<input id="wc" class="color" type="color" value="#1769aa"><input id="wc2" class="color" type="color" value="#6ee7b7"><button onclick="makeWall()">Créer</button><canvas id="wallc" width="900" height="1600"></canvas><a id="wdl" class="pill" download="caillou-wallpaper.png">Enregistrer l’image</a>`);window.makeWall=()=>{let c=wallc,x=c.getContext('2d'),g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,wc.value);g.addColorStop(1,wc2.value);x.fillStyle=g;x.fillRect(0,0,c.width,c.height);for(let i=0;i<40;i++){x.fillStyle='#ffffff22';x.beginPath();x.arc(Math.random()*c.width,Math.random()*c.height,10+Math.random()*80,0,7);x.fill()}wdl.href=c.toDataURL('image/png')}}
function gif(b){b.innerHTML=panel('🎞️ Créateur de GIF simple',`<input id="gfi" type="file" accept="image/*" multiple class="field"><div id="gfo" class="out"></div><canvas id="gfc" width="600" height="400"></canvas>`);gfi.onchange=()=>{gfo.textContent=`${gfi.files.length} image(s) sélectionnée(s). Aperçu animé ci-dessous.`;let files=[...gfi.files],i=0,ctx=gfc.getContext('2d');if(!files.length)return;let loop=()=>{let im=new Image();im.onload=()=>{ctx.clearRect(0,0,600,400);ctx.drawImage(im,0,0,600,400);i=(i+1)%files.length;setTimeout(loop,450)};im.src=URL.createObjectURL(files[i])};loop()}}
function paint(b){b.innerHTML=panel('🖌️ Caillou Paint',`<input id="pc" type="color" value="#f43f5e"><button onclick="clearPaint()">Effacer</button><canvas id="paintc" width="900" height="600"></canvas><a id="paintdl" class="pill" download="caillou-paint.png">Enregistrer PNG</a>`);let c=paintc,x=c.getContext('2d'),down=false;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);function pos(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}function draw(e){if(!down)return;let p=pos(e);x.fillStyle=pc.value;x.beginPath();x.arc(p[0],p[1],10,0,7);x.fill();e.preventDefault()}c.onpointerdown=e=>{down=true;draw(e)};c.onpointermove=draw;c.onpointerup=()=>down=false;c.onpointerleave=()=>down=false;window.clearPaint=()=>{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)};paintdl.onclick=()=>paintdl.href=c.toDataURL('image/png')}
function trip(b){b.innerHTML=panel('🧳 Préparateur de voyage',`<input id="dest" class="field" placeholder="Destination"><input id="days" class="field" type="number" min="1" value="3"><textarea id="todo" class="field" rows="7">Documents\nChargeurs\nVêtements\nTrousse de toilette\nRéservations\nTransport\nActivités</textarea><button onclick="planTrip()">Préparer</button><div id="plan" class="out"></div>`);window.planTrip=()=>{let d=+days.value||1;plan.textContent=`Voyage : ${dest.value||'Destination'}\nDurée : ${d} jour(s)\n\n${todo.value.split('\n').map(x=>'☐ '+x).join('\n')}`}}
function mystery(b){let s=['Astuce : touche une application pour voir son écran de lancement.','Secret : plusieurs données restent disponibles hors connexion.','Défi : bats ton record au Click Challenge.','Astuce : ajoute Caillou Apps à ton écran d’accueil.'];b.innerHTML=panel('❔ App Mystère',`<p>Une surprise t’attend.</p><button onclick="secretOut.textContent=secrets[Math.floor(Math.random()*secrets.length)]">Révéler</button><div id="secretOut" class="out"></div>`);window.secrets=s}
function weather(b){b.innerHTML=panel('🌦️ Météo & ciel',`<input id="city" class="field" placeholder="Ville"><div class="row"><button onclick="openWeather()">Météo</button><button class="secondary" onclick="openTides()">Marées</button><button class="secondary" onclick="openSky()">Ciel</button></div><p class="small">La version ordinateur consultait des informations externes. Ici, les recherches s’ouvrent dans le navigateur.</p>`);window.openWeather=()=>window.open('https://www.google.com/search?q='+encodeURIComponent((city.value||'météo')+' météo'),'_blank');window.openTides=()=>window.open('https://www.google.com/search?q='+encodeURIComponent((city.value||'marées')+' horaires marées'),'_blank');window.openSky=()=>window.open('https://www.google.com/search?q='+encodeURIComponent((city.value||'ciel')+' ciel astronomique'),'_blank')}
function breath(b){let run=false,t=null,phase=0,start=0; b.innerHTML=panel('🌿 Cohérence cardiaque',`<div class="small">Respiration guidée personnalisable.</div><div id="bt" class="timer">05:00</div><div id="bp" class="phase">Prêt</div><div class="row"><input id="bi" class="field" type="number" min="1" max="30" value="5" placeholder="Inspire"><input id="be" class="field" type="number" min="1" max="30" value="5" placeholder="Expire"></div><div class="row">${btn('Démarrer','startBreath()')}${btn('Arrêter','stopBreath()','secondary')}</div>`);window.startBreath=()=>{if(run)return;run=true;start=Date.now();t=setInterval(tick,200)};window.stopBreath=()=>{run=false;clearInterval(t)};function tick(){let e=Math.floor((Date.now()-start)/1000),left=Math.max(0,300-e);bt.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;let cyc=(e%(+bi.value+(+be.value)));bp.textContent=cyc<+bi.value?'Inspire':'Expire';if(!left)stopBreath()}}
function timer(b){let ti=null,left=60,cd=null;b.innerHTML=panel('⏱️ Chronomètres & Alarmes',`<div class="tabs"><button onclick="showStop()">Chronomètre</button><button onclick="showCD()">Compte à rebours</button><button onclick="showAlarm()">Alarme</button></div><div id="timerBody"></div>`);window.showStop=()=>{clearInterval(ti);let e=0;timerBody.innerHTML=`<div id="tdisp" class="timer">00:00.0</div><button onclick="swStart()">Démarrer</button><button class="secondary" onclick="swPause()">Pause</button><button class="secondary" onclick="swReset()">Réinitialiser</button>`;window.swStart=()=>{clearInterval(ti);let st=Date.now()-e;ti=setInterval(()=>{e=Date.now()-st;tdisp.textContent=new Date(e).toISOString().substr(14,8)},100)};window.swPause=()=>clearInterval(ti);window.swReset=()=>{clearInterval(ti);e=0;tdisp.textContent='00:00.0'}};window.showCD=()=>{clearInterval(ti);timerBody.innerHTML=`<input id="cdmin" class="field" type="number" value="5"><input id="cdsec" class="field" type="number" value="0"><div id="cdd" class="timer">05:00</div><button onclick="cdStart()">Démarrer</button><button class="secondary" onclick="cdStop()">Arrêter</button>`;window.cdStart=()=>{clearInterval(cd);left=(+cdmin.value||0)*60+(+cdsec.value||0);cd=setInterval(()=>{left--;cdd.textContent=`${String(Math.floor(Math.max(0,left)/60)).padStart(2,'0')}:${String(Math.max(0,left)%60).padStart(2,'0')}`;if(left<=0){clearInterval(cd);navigator.vibrate?.(200);alert('Compte à rebours terminé !')}},1000)};window.cdStop=()=>clearInterval(cd)};window.showAlarm=()=>{timerBody.innerHTML=`<input id="ah" class="field" type="time"><button onclick="setAlarm()">Programmer</button><div id="alout" class="out"></div>`;window.setAlarm=()=>{let [h,m]=ah.value.split(':').map(Number);let n=new Date(),d=new Date();d.setHours(h,m,0,0);if(d<=n)d.setDate(d.getDate()+1);setTimeout(()=>{navigator.vibrate?.([200,100,200]);alert('⏰ Alarme Caillou Apps')},d-n);alout.textContent='Alarme programmée pour '+d.toLocaleString('fr-FR')}};showStop()}
function journal(b){let unlocked=false;b.innerHTML=panel('🔒 Journal intime sécurisé',`<input id="jk" class="field" type="password" placeholder="Code secret"><button onclick="unlockJournal()">Ouvrir</button><div id="jb"></div>`);window.unlockJournal=()=>{let k=jk.value;if(!k)return;unlocked=true;let data=load('journal','');jb.innerHTML=`<textarea id="jt" class="field" rows="14" placeholder="Ton journal…"></textarea><button onclick="saveJournal()">Enregistrer</button><div class="small">Le code sert de verrou d’interface dans cette version web ; ce stockage local n’est pas un coffre cryptographique natif iOS.</div>`;jt.value=data};window.saveJournal=()=>{if(unlocked){save('journal',jt.value);toast('Journal enregistré')}}}
function showSettings(){
  showView('settings');
  const themes=['Bleu nuit','Violet','Vert','Orange','Clair'];
  settingsBody.innerHTML=`
  <div class="top" style="position:static;margin:0;padding:0 0 12px;background:none;border:0;backdrop-filter:none"><div><div class="brand">⚙️ Réglages</div><div class="sub">Personnalise Caillou Apps comme sur la version ordinateur.</div></div><button class="secondary" onclick="home()">← Accueil</button></div>
  <div class="settingsGrid">
    <div class="settingCard"><h3>🎨 Apparence</h3>
      <label>Thème</label><select id="setTheme" class="field">${themes.map(x=>`<option ${settings.theme===x?'selected':''}>${x}</option>`).join('')}</select>
      <label>Couleur d'accent</label><input id="setAccent" class="color field" type="color" value="${settings.accent}">
      <label>Taille du texte <span id="scaleVal" class="rangeValue">${Math.round((settings.font_scale||1)*100)}%</span></label><input id="setScale" type="range" min="90" max="120" step="5" value="${Math.round((settings.font_scale||1)*100)}" style="width:100%">
      <div class="switch"><span>Descriptions des applications</span><input id="setDesc" type="checkbox" ${settings.show_descriptions?'checked':''}></div>
      <div class="switch"><span>Cartes compactes</span><input id="setCompact" type="checkbox" ${settings.compact_cards?'checked':''}></div>
    </div>
    <div class="settingCard"><h3>✨ Comportement</h3>
      <div class="switch"><span>Animations</span><input id="setAnim" type="checkbox" ${settings.animations?'checked':''}></div>
      <div class="switch"><span>Notifications</span><input id="setNotif" type="checkbox" ${settings.notifications?'checked':''}></div>
      <div class="switch"><span>Tutoriel</span><input id="setTut" type="checkbox" ${settings.tutorial_enabled?'checked':''}></div>
      <div class="switch"><span>Conseils</span><input id="setTips" type="checkbox" ${settings.tips_enabled?'checked':''}></div>
      <div class="switch"><span>Effets sonores</span><input id="setSound" type="checkbox" ${settings.sound_effects?'checked':''}></div>
    </div>
    <div class="settingCard"><h3>📱 Lanceur</h3>
      <label>Colonnes sur grand écran</label><select id="setColumns" class="field"><option>Auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
      <p class="small">L'écran noir à points reste utilisé pour le lancement de chaque application.</p>
      <button onclick="saveSettingsUI()">💾 Enregistrer les réglages</button>
    </div>
    <div class="settingCard"><h3>🧰 Maintenance</h3>
      <button class="secondary" onclick="showStats()">📊 Statistiques</button>
      <button class="secondary" onclick="showAppManager()">🧩 Gérer les applications</button>
      <button class="danger" onclick="resetCaillouSettings()">♻ Réinitialiser les réglages</button>
      <p class="small">Version ${APP_VERSION} • Les réglages sont enregistrés sur cet appareil.</p>
    </div>
  </div>`;
  setColumns.value=settings.columns||'Auto';
  setScale.oninput=()=>{scaleVal.textContent=setScale.value+'%';document.body.style.fontSize=(Number(setScale.value)/100)+'em'};
  setTheme.onchange=()=>{settings.theme=setTheme.value;applyTheme()};
  setAccent.oninput=()=>{document.documentElement.style.setProperty('--accent',setAccent.value)};
}
function saveSettingsUI(){
  settings.theme=setTheme.value;settings.accent=setAccent.value;settings.font_scale=Number(setScale.value)/100;settings.show_descriptions=setDesc.checked;settings.compact_cards=setCompact.checked;settings.animations=setAnim.checked;settings.notifications=setNotif.checked;settings.tutorial_enabled=setTut.checked;settings.tips_enabled=setTips.checked;settings.sound_effects=setSound.checked;settings.columns=setColumns.value;saveSettings();applyTheme();render();
toast('✅ Réglages enregistrés');showSettings();
}
function resetCaillouSettings(){if(!confirm('Réinitialiser les réglages de Caillou Apps ?'))return;localStorage.removeItem('caillou_settings');settings={...defaultSettings,daily_challenge:{...defaultSettings.daily_challenge},dev_metrics:{...defaultSettings.dev_metrics}};saveSettings();applyTheme();render();
showSettings();toast('Réglages réinitialisés')}
function showAppManager(){showView('settings');settingsBody.innerHTML=`<div class="top" style="position:static;margin:0;padding:0 0 12px;background:none;border:0"><div><div class="brand">🧩 Applications</div><div class="sub">Active ou masque les applications du lanceur.</div></div><button class="secondary" onclick="showSettings()">← Réglages</button></div><div class="panel appManager">${apps.map(a=>{let off=(settings.disabled_apps||[]).includes(a[1]);return `<div class="managerRow"><span>${a[0]} <b>${a[1]}</b><div class="small">${categoryOf(a[1])}</div></span><button class="${off?'danger':'secondary'}" onclick="toggleDisabledApp('${a[1].replace(/'/g,"\\'")}')">${off?'Masquée':'Visible'}</button></div>`}).join('')}</div>`}
function toggleDisabledApp(name){let a=new Set(settings.disabled_apps||[]);a.has(name)?a.delete(name):a.add(name);settings.disabled_apps=[...a];saveSettings();showAppManager();render()}
function showProfile(){showView('profile');let xp=settings.profile_xp||0,level=settings.profile_level||1,next=level*100;profileBody.innerHTML=`<div class="top" style="position:static;margin:0;padding:0 0 12px;background:none;border:0"><div><div class="brand">👤 Profil</div><div class="sub">Ta progression Caillou Apps</div></div><button class="secondary" onclick="home()">← Accueil</button></div><div class="panel center"><div style="font-size:54px">🪨</div><h2>${esc(settings.profile_name||'Joueur')}</h2><div class="badge">Niveau ${level}</div><p class="stat">${xp} XP</p><p class="small">${Math.max(0,next-xp)} XP avant le prochain niveau</p><p>🚀 ${settings.profile_launches||0} lancement(s) • 🏆 ${(settings.achievements||[]).length} succès</p></div><div class="panel"><h3>🕘 Applications récentes</h3><div class="list">${(settings.recent_apps||[]).map(x=>`<button onclick="openByTitle('${x.replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('')||'<p class="small">Aucune application récente.</p>'}</div></div>`}
function openByTitle(title){let a=apps.find(x=>x[1]===title);if(a)openApp(a[3],a[1])}
function showAbout(){showView('about');aboutBody.innerHTML=`<div class="top" style="position:static;margin:0;padding:0 0 12px;background:none;border:0"><div><div class="brand">ⓘ À propos</div><div class="sub">Caillou Apps</div></div><button class="secondary" onclick="home()">← Accueil</button></div><div class="panel"><h2>Caillou Apps ${APP_VERSION}</h2><p>Suite personnelle d'applications adaptée au tactile à partir du programme ordinateur.</p><p class="small">Développé par Caillou • interface optimisée iPhone et Samsung.</p><h3>✨ Cette mise à jour</h3><p>Nouvelle interface, réglages fonctionnels, arrière-plan photo paradisiaque, gestion des applications, profil et meilleure finition visuelle.</p></div>`}

function showStats(){alert(`Caillou Apps iPhone\n\n${apps.length} applications\nDonnées locales : ${Object.keys(localStorage).length} entrées`)}
const views={ttt,rps,dict,sudoku,arcade,calc,teams,flash,wall,gif,paint,check,trip,assistant,mystery,security,convert,weather,breath,timer,journal,space,race,pacman:arcade,tetris:arcade,wheel,click:clickChallenge,notes,instrument,dice,dare,slots,pong,dino,memory,quiz,puzzle,calendar,vault,map:mapApp,sun,passgen};
applyTheme();render();
try{if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=8',{updateViaCache:'none'}).catch(()=>{});}catch{}
</script></body></html>
